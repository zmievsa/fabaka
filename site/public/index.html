<style>
:root{
  --peri:#7687EF;
  --peri-deep:#4A5BD4;
  --peri-tint:#EDEFFC;
  --ink:#1B1B1B;
  --ink-2:#26272F;
  --snow:#FCFBFC;
  --panel:rgba(22,23,33,.9);
  --row:40px;
  --gut:clamp(16px,4.4vw,64px);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sys:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;
  --out:cubic-bezier(.16,1,.3,1);
  --spring:cubic-bezier(.34,1.56,.64,1);
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scrollbar-color:var(--ink) var(--peri-tint);background:var(--peri)}
body{margin:0;background:var(--peri);color:var(--ink);font:400 1.0625rem/1.55 var(--display);font-optical-sizing:auto;-webkit-font-smoothing:antialiased;overflow-x:clip}
::selection{background:var(--ink);color:var(--snow)}
a{color:inherit;text-underline-offset:.22em;text-decoration-thickness:1.5px}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.wrap{width:min(100%,1312px);margin-inline:auto}
.sec{position:relative;padding-inline:var(--gut)}

.word{
  margin:0;font-family:var(--display);font-weight:800;font-stretch:75%;
  font-size:clamp(6.5rem,30vw,11rem);line-height:.8;letter-spacing:-.02em;
  font-variation-settings:"opsz" 96;
}
.word .dot{color:var(--snow)}
.lede{font:600 clamp(1.35rem,2vw,1.75rem)/1.18 var(--display);letter-spacing:-.015em;margin:0;text-wrap:balance}

kbd{
  display:inline-block;min-width:1.75em;padding:.08em .42em .12em;margin-inline:.06em;
  border-radius:6px;background:var(--snow);color:var(--ink);
  border:1px solid rgba(27,27,27,.28);box-shadow:0 2px 0 rgba(27,27,27,.5);
  font:600 .86em/1.35 var(--sys);text-align:center;vertical-align:.08em;
  transition:transform .06s,box-shadow .06s;
}
kbd.down{transform:translateY(2px);box-shadow:0 0 0 rgba(27,27,27,.5)}

/* ---------- top bar ---------- */
.bar{display:flex;align-items:center;justify-content:space-between;gap:1rem;height:68px;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:.6rem;font:700 1.35rem/1 var(--display);letter-spacing:-.02em;text-decoration:none}
.brand img{width:38px;height:38px;display:block;margin-left:-3px}
.gh{display:inline-flex;align-items:center;gap:.5rem;font-weight:600;text-decoration:none;padding:.45rem .2rem}
.gh svg{width:20px;height:20px}
.gh:hover span{text-decoration:underline}

/* ---------- FETCH ---------- */
body{min-height:100svh;display:flex;flex-direction:column}
main{flex:1;display:flex;flex-direction:column}
.fetch{overflow-x:clip;flex:1;display:flex;flex-direction:column;padding-bottom:clamp(2.5rem,5vw,4rem)}
.hero{flex:1;display:grid;grid-template-columns:minmax(0,1fr);gap:2.25rem;align-items:center;padding-top:clamp(.75rem,2vw,1.5rem)}
.act{display:grid;gap:1rem;max-width:34rem}
.act .word{margin-bottom:.9rem}
.install{display:flex;align-items:center;gap:.5rem;background:var(--ink);color:var(--snow);border-radius:14px;padding:6px 6px 6px 18px;box-shadow:0 18px 34px -18px rgba(17,18,38,.75),0 2px 6px rgba(17,18,38,.18)}
.install code{flex:1;min-width:0;font:500 .95rem/1.4 var(--mono);white-space:nowrap;padding:.7rem 0;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis}
.install code::selection,.install code *::selection{background:var(--peri);color:var(--ink)}
.install .pr{color:var(--peri);margin-right:.6em;user-select:none}
.cp{
  flex:none;display:inline-flex;align-items:center;justify-content:center;gap:.45rem;min-width:7rem;height:46px;padding:0 1rem;
  border:0;border-radius:10px;background:var(--peri);color:var(--ink);font:700 1rem/1 var(--display);cursor:pointer;
  transition:background-color .15s,transform .1s;
}
.cp:hover{background:#8C9AF3}
.cp:active{transform:translateY(1px)}
.cp svg{width:17px;height:17px}
.cp .ok{display:none}
.cp.done{background:var(--snow)}
.cp.done .ok{display:block}.cp.done .cpy{display:none}
.install .cp:focus-visible{outline-color:var(--snow)}

/* ---------- the stage: a collie on ⌘ and Tab, over the screen ---------- */
.stage{margin:0;position:relative;width:min(100%,600px);justify-self:center;--dogw:clamp(230px,62vw,300px)}
.rig{position:relative;width:var(--dogw);height:120em;font-size:calc(var(--dogw) / 100);margin:0 auto -1.2em;pointer-events:none}
.rig>*{position:absolute}
.body{left:0;top:0;width:100em;height:104.1em;z-index:1;transform-origin:50% 96%;transition:transform .32s var(--out)}
.body img,.paw img{display:block;width:100%;height:100%}
.paw{z-index:4;transition:transform .09s var(--out)}
.paw-l{left:9.494em;top:79.905em;width:31.013em;height:22.627em}
.paw-r{left:43.987em;top:81.646em;width:30.063em;height:22.152em}
.key{
  z-index:3;top:90em;height:30em;pointer-events:auto;cursor:pointer;
  display:flex;align-items:flex-end;gap:2.2em;padding:0 3.6em 3.4em;
  border-radius:4.2em;border:1px solid rgba(27,27,27,.35);background:var(--snow);color:var(--ink);
  box-shadow:0 2.4em 0 -.2em #C9CDE6,0 2.4em 0 .5px rgba(27,27,27,.35),0 5em 5em -2em rgba(17,18,38,.45);
  font-family:var(--sys);text-align:left;transition:transform .05s linear,box-shadow .05s linear;
  -webkit-tap-highlight-color:transparent;
}
.key b{font-size:8.5em;font-weight:500;line-height:.9}
.key small{font-size:5.2em;font-weight:600;line-height:1;color:#4A4B57;padding-bottom:.12em}
.key-cmd{left:4em;width:40em;justify-content:flex-end}
.key-tab{left:46.5em;width:47em}
.key.down{transform:translateY(1.9em);box-shadow:0 .5em 0 -.2em #C9CDE6,0 .5em 0 .5px rgba(27,27,27,.35),0 2em 3em -1.5em rgba(17,18,38,.45)}
.key:focus-visible{outline:3px solid var(--ink);outline-offset:3px;border-radius:4.2em}
.key:hover:not(.down){background:#fff}
.rig.cmd .paw-l{transform:translateY(1.9em)}
.rig.cmd .body{transform:rotate(-3deg)}
.rig.hop .body{animation:hop .4s var(--out)}
@keyframes hop{0%{transform:none}38%{transform:translateY(-2.4em) rotate(2deg)}100%{transform:none}}

/* the fetched window, carried like a stick */
.stick{
  z-index:5;left:calc(var(--dogw) * .415);top:calc(var(--dogw) * .655);display:inline-flex;align-items:center;gap:.5em;
  font:600 4.8em/1 var(--sys);color:#F4F4F8;white-space:nowrap;
  padding:.42em .7em .42em .45em;border-radius:.55em;background:var(--peri-deep);
  box-shadow:0 .5em 1em -.4em rgba(17,18,38,.6);
  transform:translate(-50%,-50%) rotate(-7deg) scale(.4);opacity:0;visibility:hidden;
}
.stick svg{width:1.45em;height:1.45em;flex:none}
.stick.on{visibility:visible;opacity:1;transform:translate(-50%,-50%) rotate(-7deg);transition:transform .16s var(--spring),opacity .06s}
.stick.drop{visibility:visible;opacity:0;transform:translate(-50%,40%) rotate(-24deg);transition:transform .32s cubic-bezier(.5,0,.9,.4),opacity .3s .05s,visibility 0s .4s}

.box{position:relative;z-index:2}

.panel{
  position:relative;width:100%;padding:8px;border-radius:16px;
  background:var(--panel);-webkit-backdrop-filter:blur(28px) saturate(1.35);backdrop-filter:blur(28px) saturate(1.35);
  border:1px solid rgba(255,255,255,.09);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 34px 60px -26px rgba(17,18,38,.7),0 10px 22px -8px rgba(17,18,38,.3);
  font-family:var(--sys);color:#F4F4F8;
}
.rows{position:relative;--i:0}
.rows ul{list-style:none;margin:0;padding:0;position:relative;z-index:1}
/* no transition: the selection is simply where you asked for it */
.hl{position:absolute;left:0;right:0;top:0;height:var(--row);border-radius:8px;background:var(--peri-deep);transform:translateY(calc(var(--i) * var(--row)))}
.row{display:flex;align-items:center;gap:12px;height:var(--row);padding:0 12px;overflow:hidden;white-space:nowrap;cursor:default}
.box.open .row{cursor:pointer}
.ic{width:28px;height:28px;flex:none;display:block}
.row .t{font-size:14px;font-weight:500;overflow:hidden;text-overflow:ellipsis;min-width:0}
.row .a{margin-left:auto;padding-left:12px;flex:none;display:inline-flex;align-items:center;gap:6px;font-size:12px;color:rgba(235,235,245,.64)}
.row.on .a{color:rgba(255,255,255,.9)}
.row .g{width:14px;height:14px}
.row.min .ic,.row.hid .ic{opacity:.45}

/* windows that end up on top */
.win{position:absolute;inset:0;display:none;flex-direction:column;border-radius:14px;overflow:hidden;background:#fff;
  box-shadow:0 34px 60px -26px rgba(17,18,38,.7),0 10px 22px -8px rgba(17,18,38,.3);font-family:var(--sys)}
.win.front{display:flex}
.tb{flex:none;display:flex;align-items:center;gap:7px;height:38px;padding:0 14px;background:#F1F1F5;border-bottom:1px solid #E1E1E8;font-size:13px;font-weight:600;color:#2A2A33;white-space:nowrap}
.tb i{width:11px;height:11px;border-radius:50%;background:#CFCFD8;flex:none}
.tb .ic{width:18px;height:18px;margin-left:8px}
.tb .wa{margin-left:auto;font-weight:400;color:#62626E;font-size:12px}
.wb{flex:1;padding:22px 24px;font-size:14px;color:#2A2A33;overflow:hidden}
.wb .wh{margin:0 0 4px;font-size:20px;font-weight:700;letter-spacing:-.01em}
.wb .sub{margin:0 0 18px;color:#62626E;font-size:13px}
.diff{font:500 12.5px/1.9 var(--mono);border:1px solid #E1E1E8;border-radius:8px;overflow:hidden;font-variant-ligatures:none}
.diff div{padding:0 12px;white-space:pre;overflow:hidden;text-overflow:ellipsis}
.diff .m{background:#FDECEC;color:#8A1C1C}.diff .p{background:#E7F6EC;color:#14532D}
.code,.term{background:#1E1F29;color:#D7D8E4}
.code .tb,.term .tb{background:#272836;border-color:#33344A;color:#E7E7F0}
.code .tb i,.term .tb i{background:#4A4B5E}
.code .tb .wa,.term .tb .wa{color:#A3A4B8}
.code .wb,.term .wb{color:#D7D8E4}
.code pre,.term pre{margin:0;font:500 13px/1.85 var(--mono);white-space:pre;overflow:hidden}
.code .k{color:#A5B1FF}.code .f{color:#7EE0B5}.code .c{color:#8C8DA3}.code .s{color:#F5C77E}
.term .ok{color:#A3E635}.term .dim{color:#8C8DA3}
.fl,.ml{display:grid;gap:8px}
.fl div,.ml div{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:12px 14px;border:1px solid #E1E1E8;border-radius:10px;font-variant-numeric:tabular-nums}
.fl b,.ml b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl span,.ml span{color:#62626E;font-size:13px;flex:none}
.ml .new b::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:#0891B2;margin-right:8px;vertical-align:.12em}
.gl{list-style:none;margin:0;padding:0;display:grid;gap:10px;font-size:15px}
.gl li{display:flex;align-items:center;gap:10px}
.gl li::before{content:"";width:16px;height:16px;border-radius:5px;border:1.6px solid #A16207;flex:none}
.gl li.x{color:#8C8DA3;text-decoration:line-through}
.gl li.x::before{background:#FACC15;border-color:#FACC15}
.chat{display:grid;gap:8px;align-content:start}
.chat p{margin:0;max-width:75%;padding:9px 13px;border-radius:16px;background:#F1F1F5;font-size:14px}
.chat p.me{justify-self:end;background:#15803D;color:#fff}
.chat small{color:#62626E;font-size:12px}
.art{display:grid;place-items:center;height:100%;background:#FFF7ED;border-radius:10px}
.art svg{width:46%;height:auto}
.mus{display:grid;place-items:center;align-content:center;gap:6px;height:100%;text-align:center;color:#62626E}
.mus svg{width:64px;height:64px}

.box .panel{display:block}
.motion .box:not(.open) .panel,.js .box:not(.open) .panel{visibility:hidden}
.box.open .win{display:none}

/* ---------- ALREADY BACK (speed, real time) ---------- */
.site-foot{background:var(--peri);color:var(--ink)}
.foot{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem 2rem;padding:1.6rem 0 2rem;border-top:1.5px solid var(--ink)}
.foot .brand{font-size:1.05rem}
.foot .brand img{width:26px;height:26px}
.foot nav{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;margin-left:auto}
.foot nav a{font-weight:600;text-decoration:none}
.foot nav a:hover{text-decoration:underline;text-underline-offset:.2em}
.foot small{font-size:.9rem;color:var(--ink)}

@media (min-width:760px){
}
@media (min-width:1080px){
  .hero{grid-template-columns:minmax(0,.92fr) minmax(0,1fr);column-gap:clamp(3rem,6vw,6rem)}
  .word{font-size:clamp(11rem,15vw,14.5rem)}
  .stage{justify-self:end}
}

@media (max-width:560px){
  .install{flex-wrap:wrap;padding:6px}
  .install code{flex-basis:100%;padding:.75rem .7rem .55rem;font-size:.84rem}
  .install .cp{flex:1}
  .panel{padding:6px;border-radius:14px}
  .row{gap:10px;padding:0 10px}
  .ic{width:24px;height:24px}
  .row .t{font-size:13.5px}
  .row .a{font-size:11.5px;padding-left:8px}
  .wb{padding:16px}
  .code pre,.term pre{font-size:11.5px}
  .diff{font-size:11px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-iteration-count:1!important}
}
</style>
</head>

<main>
<section class="sec fetch" id="fetch" aria-labelledby="fetch-h">
  <header class="wrap bar">
    <a class="brand" href="#fetch"><img src="/assets/fabaka-icon.webp" alt="" width="38" height="38">Fabaka</a>
    <a class="gh" href="https://github.com/zmievsa/fabaka"><svg aria-hidden="true"><use href="#u-gh"/></svg><span>GitHub</span></a>
  </header>

  <div class="wrap hero">
    <div class="act">
      <h1 class="word" id="fetch-h"><span class="sr">Fabaka. </span>Fetch<span class="dot">.</span></h1>
      <p class="lede">Fabaka is a fast ⌘Tab for Mac.</p>

<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => [...r.querySelectorAll(s)];
  const root = document.documentElement;
  const motion = root.classList.contains('motion');
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  const INSTALL = 'brew install --cask zmievsa/tap/fabaka';
  if (matchMedia('(pointer: coarse)').matches) root.classList.add('touch');

  /* ---------- copy ---------- */
  $$('[data-copy]').forEach(btn => btn.addEventListener('click', async () => {
    let ok = false;
    try { await navigator.clipboard.writeText(INSTALL); ok = true; } catch (e) {
      const ta = document.createElement('textarea');
      ta.value = INSTALL; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;opacity:0';
      document.body.append(ta); ta.select();
      try { ok = document.execCommand('copy'); } catch (e2) {}
      ta.remove();
    }
    const lbl = $('.lbl', btn);
    if (!ok) {
      const sel = getSelection(), range = document.createRange();
      range.selectNodeContents(btn.previousElementSibling); sel.removeAllRanges(); sel.addRange(range);
    }
    lbl.textContent = ok ? 'Copied' : 'Press ⌘C';
    btn.classList.toggle('done', ok);
    $('#copy-status').textContent = ok ? 'Install command copied.' : 'Install command selected. Press Command C to copy.';
    clearTimeout(btn._t);
    btn._t = setTimeout(() => { lbl.textContent = btn.dataset.label; btn.classList.remove('done'); }, 2200);
  }));

  /* ---------- the switcher ---------- */
  const box = $('#box'), rows = $('#fab-rows'), list = $('ul', rows), rig = $('#rig');
  const pawR = $('#paw-r'), stick = $('#stick'), status = $('#sw-status');
  const kCmd = $('#k-cmd'), kTab = $('#k-tab');
  const W = {
    app:  ['editor', 'app.swift', 'Editor'],
    lis:  ['browser', 'Flights to Lisbon', 'Browser'],
    term: ['terminal', '~/code · zsh', 'Terminal'],
    pr:   ['browser', 'PR #212 · fix login', 'Browser'],
    mail: ['mail', 'Inbox (3)', 'Mail'],
    logo: ['design', 'Logo v4', 'Design', 'hid'],
    groc: ['notes', 'Groceries', 'Notes', 'min'],
    team: ['chat', 'Team', 'Chat'],
    music:['music', 'Music', 'No windows'],
  };
  let order = ['pr', 'app', 'lis', 'term', 'mail', 'logo', 'groc', 'team', 'music'];
  let sel = 0, open = false, held = false;

  const render = () => {
    list.innerHTML = order.map(k => {
      const [ic, t, a, kind] = W[k];
      const g = kind ? `<svg class="g"><use href="#g-${kind}"/></svg>` : '';
      return `<li class="row${kind ? ' ' + kind : ''}" data-k="${k}"><svg class="ic"><use href="#i-${ic}"/></svg><span class="t">${t}</span><span class="a">${g}${a}</span></li>`;
    }).join('');
  };
  const select = i => {
    sel = (i + order.length) % order.length;
    rows.style.setProperty('--i', sel);
    $$('.row', rows).forEach((r, k) => r.classList.toggle('on', k === sel));
  };
  const front = k => $$('.win', box).forEach(w => w.classList.toggle('front', w.dataset.w === k));
  const press = (key, ms = 110) => {
    key.classList.add('down');
    clearTimeout(key._t);
    key._t = setTimeout(() => key.classList.remove('down'), ms);
  };

  function cmdDown() {
    if (held) return;
    held = true;
    rig.classList.add('cmd'); kCmd.classList.add('down');
    kCmd.setAttribute('aria-pressed', 'true');
  }
  // the list and the selection change in the same frame the key lands: no fade, no wait
  function step(d) {
    if (!held) cmdDown();
    if (!open) { open = true; render(); select(d > 0 ? 1 : order.length - 1); box.classList.add('open'); }
    else select(sel + d);
    press(kTab);
    status.textContent = W[order[sel]][1];
  }
  function cmdUp(commit = true) {
    if (!held) return;
    held = false;
    rig.classList.remove('cmd'); kCmd.classList.remove('down');
    kCmd.setAttribute('aria-pressed', 'false');
    if (!open) return;
    open = false;
    box.classList.remove('open');
    if (!commit) return;
    const [chosen] = order.splice(sel, 1);
    order.unshift(chosen);
    front(chosen);
    fetched(chosen);
  }
  function fetched(k) {
    status.textContent = 'Switched to ' + W[k][1];
    if (!motion) return;
    stick.innerHTML = `<svg><use href="#i-${W[k][0]}"/></svg>${W[k][1]}`;
    stick.classList.remove('drop'); void stick.offsetWidth; stick.classList.add('on');
    rig.classList.remove('hop'); void rig.offsetWidth; rig.classList.add('hop');
    clearTimeout(stick._t);
    stick._t = setTimeout(() => { stick.classList.remove('on'); stick.classList.add('drop'); }, 900);
  }
  // the paw winds up, then lands; the list moves on the landing
  function slam(d, windup) {
    if (!motion) { step(d); return; }
    const up = windup ? 'translate(-1.5em,-9em) rotate(-14deg)' : 'translate(-.5em,-3em) rotate(-6deg)';
    const t = windup ? 230 : 110;
    pawR.animate([
      { transform: 'none' },
      { transform: up, offset: .55, easing: 'cubic-bezier(.5,0,.9,.5)' },
      { transform: 'translateY(1.9em)', offset: .8 },
      { transform: 'none' },
    ], { duration: t, easing: 'ease-out' });
    setTimeout(() => step(d), t * .8);
  }

  /* visitor drives it: ⌥ stands in for ⌘, which belongs to the Mac */
  let userUntil = 0;
  const user = () => { userUntil = Date.now() + 7000; };
  addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey) return;
    if (e.key === 'Alt') { if (!e.repeat) { user(); cmdDown(); } return; }
    if (!e.altKey) return;
    const k = e.key;
    if (k === 'Tab') { e.preventDefault(); user(); slam(e.shiftKey ? -1 : 1, false); }
    else if (open && (k === 'ArrowDown' || k === 'ArrowRight')) { e.preventDefault(); user(); step(1); }
    else if (open && (k === 'ArrowUp' || k === 'ArrowLeft')) { e.preventDefault(); user(); step(-1); }
    else if (open && k === 'Escape') { e.preventDefault(); user(); cmdUp(false); }
    else if (open && k === 'Enter') { e.preventDefault(); user(); cmdUp(true); }
  });
  addEventListener('keyup', e => { if (e.key === 'Alt' && held) { user(); cmdUp(true); } });
  addEventListener('blur', () => cmdUp(false));
  kCmd.addEventListener('click', () => { user(); held ? cmdUp(true) : cmdDown(); });
  kTab.addEventListener('click', () => { user(); slam(1, false); });
  list.addEventListener('click', e => {
    const r = e.target.closest('.row');
    if (!open || !r) return;
    user(); select($$('.row', rows).indexOf(r)); cmdUp(true);
  });

  /* ---------- the loop, while nobody else is pressing keys ---------- */
  let visible = true;
  const idle = () => visible && !document.hidden && Date.now() > userUntil;
  const wait = async ms => {
    const end = Date.now() + ms;
    while (Date.now() < end) { await sleep(Math.min(120, end - Date.now())); if (!idle()) throw 0; }
  };
  async function loop() {
    const targets = ['app', 'lis', 'term', 'pr'];
    let c = 0;
    for (;;) {
      try {
        while (!idle()) await sleep(250);
        if (held) cmdUp(true);
        await wait(1200);
        cmdDown();
        await wait(380);
        const n = Math.max(1, order.indexOf(targets[c++ % targets.length]));
        for (let k = 1; k <= n; k++) { slam(1, true); await wait(k < n ? 420 : 300); }
        await wait(1100);
        cmdUp(true);
        await wait(900);
      } catch (_) { /* the visitor took over */ }
    }
  }

  // settled still: the window that was on top
  render(); select(0); front(order[0]); box.classList.remove('open');
  if (motion) {
    new IntersectionObserver(es => es.forEach(e => { visible = e.isIntersecting; })).observe(box);
    loop();
  }
})();
</script>
